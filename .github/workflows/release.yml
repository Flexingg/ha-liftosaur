name: Release

# Push a tag like v0.2.0 and this builds liftosaur.zip (with the version set
# in manifest.json) and publishes a GitHub release for HACS.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/liftosaur/manifest.json > m.json
          mv m.json custom_components/liftosaur/manifest.json
      - name: Zip
        run: cd custom_components/liftosaur && zip -r ../../liftosaur.zip .
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: liftosaur.zip
